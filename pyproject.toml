[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tools", "shared"]
addopts = "--import-mode=importlib"
markers = ["corpus: runs against the full saved Bandai crawl in tools/gundam_cards/data/raw (skipped if absent)"]
