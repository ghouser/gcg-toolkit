[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.format]
# Python only: the code blocks in Markdown docs are left as written.
exclude = ["*.md"]

[tool.ruff.lint]
# Rules that catch bugs, dead code and outdated idioms, not layout (layout is left to `ruff format`).
select = [
    "E4", "E7", "E9",  # pycodestyle: imports, statements, syntax errors (not whitespace or line length)
    "F",               # Pyflakes: unused or undefined names and imports
    "B",               # flake8-bugbear: likely bugs
    "UP",              # pyupgrade: idioms for the target Python
    "C4",              # flake8-comprehensions: needless list/dict/set calls
    "SIM",             # flake8-simplify: needlessly complex conditions
    "PIE",             # flake8-pie: unnecessary statements
    "PLE",             # pylint errors
    "RUF",             # Ruff's own checks: mutable class defaults, ambiguous characters, unused noqa
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tools", "shared"]
addopts = "--import-mode=importlib"
markers = ["real_data: reads the real local dataset; skipped unless GCG_TEST_REAL_DATA=1 (see conftest.py), and skips on an empty dataset"]
